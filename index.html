<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>
    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/bases.css">
    <link rel="stylesheet" href="styles/banner.css">
    <link rel="stylesheet" href="styles/search.css">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/gender.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">

    <script type="module" src="js/main.js" defer></script>
</head>
<body>
    
    <!-- <header class="header">
        <nav class="header__nav">
            s
        </nav>
    </header> -->

    <section class="section-banner">
        <div class="banner-overlay" id="overlay"></div>
        <div class="banner_div-quieto">
            <div class="banner-container"></div>
        </div>
    </section>
    <section class="search">
        <h2 class="search__title">
            ¿Qué Buscas Hoy?
        </h2>
        <input type="search" class="search__input flotar" placeholder="Busca camisetas, pantalones, hooddies ...">
        <div class="tendencia tendencias-container">
            <span class="tendencia__span flotar">Hoddies</span>
            <span class="tendencia__span flotar">Pantolones</span>
            <span class="tendencia__span flotar">Oversize</span>
            <span class="tendencia__span flotar">Frieren Collec</span>
            <span class="tendencia__span flotar">One Piece</span>
            <span class="tendencia__span flotar">BabyMetal</span>
            <span class="tendencia__span flotar">Ghost</span>
        </div>
    </section>

    <main class="main">
        <h3 class="gender__title-section">
            ELIGE TU ESTILO
        </h3>
        <section class="gender__container">
            <article class="gender__mixto" style="--bg: url(https://i.pinimg.com/1200x/dc/33/bd/dc33bdaa06ebe8a728a0789e281d99fd.jpg)">
                <div class="gender__overlay">
                    <h3 class="gender__title">unisex</h3>
                    <p class="gender__p">¿Quién dice que la ropa tiene género?</p>
                </div>
            </article>
            <article class="gender__descuentos" style="--bg: url(https://i.pinimg.com/1200x/3c/5d/a0/3c5da0ae45613c4b5e8add85b918cf46.jpg)">
                <div class="gender__overlay">
                    <h3 class="gender__title">Descuentos</h3>
                    <p class="gender__p">Ofertas Imperdibles</p>
                </div>
            </article>
            <article class="gender__hombre" style="--bg: url(https://i.pinimg.com/736x/d6/90/46/d6904644ee33d8c9e5503b1f402cf43f.jpg    )">
                <div class="gender__overlay">
                    <h3 class="gender__title">masculino</h3>
                    <p class="gender__p">Mejoremos tu buen estilo</p>
                </div>
            </article>
            <article class="gender__mujer" style="--bg: url(../multimedia/mujer.jpg)">
                <div class="gender__overlay">
                    <h3 class="gender__title">Femenino</h3>
                    <p class="gender__p">Sé tú misma donde sea</p>
                </div>
            </article>
            <article class="gender__new-colab">
                <div class="gender__banner-container">
                    <!-- se crea en js -->
                </div>
                <div class="gender__overlay">
                    <h3 class="gender__title">New Colabs</h3>
                    <p class="gender__p">Nuevas aventuras</p>
                </div>
            </article>
            <article class="gender__surprise dice__container">
                <!-- js -->
            </article>
        </section>
    </main>
    
    <br>

    <br>

    <br>

</body>
</html>
